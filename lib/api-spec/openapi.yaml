openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Trademark Tracker API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: trademarks
    description: Trademark record operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /trademarks:
    get:
      operationId: listTrademarks
      tags: [trademarks]
      summary: List trademarks with optional search/filter
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Search by TM No, app name, or folder number
        - name: stage
          in: query
          required: false
          schema:
            type: string
          description: Filter by stage
        - name: city
          in: query
          required: false
          schema:
            type: string
          description: Filter by city
        - name: caseType
          in: query
          required: false
          schema:
            type: string
          description: Filter by case type
        - name: subStage
          in: query
          required: false
          schema:
            type: string
          description: Filter by sub-stage
        - name: source
          in: query
          required: false
          schema:
            type: string
            enum: [local, sheets, all]
          description: "Data source: local (DB only), sheets (Google Sheets only), all (merged)"
      responses:
        "200":
          description: List of trademarks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Trademark"
    post:
      operationId: createTrademark
      tags: [trademarks]
      summary: Create a new trademark record
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrademarkInput"
      responses:
        "201":
          description: Created trademark
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trademark"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trademarks/stats:
    get:
      operationId: getTrademarkStats
      tags: [trademarks]
      summary: Get trademark statistics
      responses:
        "200":
          description: Statistics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TrademarkStats"

  /trademarks/sync:
    post:
      operationId: syncFromSheets
      tags: [trademarks]
      summary: Sync trademark data from Google Sheets
      responses:
        "200":
          description: Sync result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /trademarks/{id}:
    get:
      operationId: getTrademark
      tags: [trademarks]
      summary: Get a trademark by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Trademark record
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trademark"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateTrademark
      tags: [trademarks]
      summary: Update a trademark record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TrademarkUpdate"
      responses:
        "200":
          description: Updated trademark
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Trademark"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteTrademark
      tags: [trademarks]
      summary: Delete a trademark record
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted successfully
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trademarks/{id}/change-log:
    get:
      operationId: getTrademarkChangeLog
      tags: [trademarks]
      summary: Get the audit/change log for a trademark
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of change log entries
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChangeLogEntry"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /trademarks/check-duplicate:
    get:
      operationId: checkDuplicate
      tags: [trademarks]
      summary: Check if a TM No already exists
      parameters:
        - name: tmNo
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Check result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DuplicateCheckResult"

  /trademarks/monthly-stats:
    get:
      operationId: getMonthlyStats
      tags: [trademarks]
      summary: Get trademark statistics grouped by month
      responses:
        "200":
          description: Monthly stats
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MonthlyStat"

  /trademarks/import-csv:
    post:
      operationId: importCsv
      tags: [trademarks]
      summary: Import trademarks from CSV
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ImportCsvPayload"
      responses:
        "200":
          description: Import result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SyncResult"

  /agents:
    get:
      operationId: listAgents
      tags: [agents]
      summary: List all agents
      responses:
        "200":
          description: List of agents
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Agent"
    post:
      operationId: createAgent
      tags: [agents]
      summary: Create a new agent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "201":
          description: Created agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"

  /agents/{id}:
    put:
      operationId: updateAgent
      tags: [agents]
      summary: Update an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentInput"
      responses:
        "200":
          description: Updated agent
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
    delete:
      operationId: deleteAgent
      tags: [agents]
      summary: Delete an agent
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: number
      responses:
        "204":
          description: Deleted successfully

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    ErrorResponse:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Trademark:
      type: object
      properties:
        id:
          type: number
        date:
          type: string
        prefix:
          type: string
        clientNo:
          type: string
        clientName:
          type: ["string", "null"]
        caseNo:
          type: string
        folderNo:
          type: ["string", "null"]
        appName:
          type: ["string", "null"]
        appClass:
          type: ["string", "null"]
        tmNo:
          type: ["string", "null"]
        city:
          type: string
        stage:
          type: string
        subStage:
          type: ["string", "null"]
        status:
          type: string
        caseType:
          type: ["string", "null"]
        isDuplicate:
          type: boolean
        isTm11:
          type: boolean
        notes:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        pdfUrl:
          type: ["string", "null"]
        source:
          type: string
          description: "Origin of the record: local or sheets"
        createdAt:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
      required:
        - id
        - date
        - prefix
        - clientNo
        - caseNo
        - city
        - stage
        - status
        - isDuplicate
        - isTm11
        - source

    TrademarkInput:
      type: object
      properties:
        date:
          type: string
        prefix:
          type: string
        clientNo:
          type: string
        clientName:
          type: ["string", "null"]
        caseNo:
          type: string
        folderNo:
          type: ["string", "null"]
        appName:
          type: string
        appClass:
          type: ["string", "null"]
        tmNo:
          type: ["string", "null"]
        city:
          type: string
        stage:
          type: string
        subStage:
          type: ["string", "null"]
        status:
          type: string
        caseType:
          type: ["string", "null"]
        isDuplicate:
          type: boolean
        isTm11:
          type: boolean
        notes:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        pdfUrl:
          type: ["string", "null"]
        assignedTo:
          type: ["string", "null"]
      required:
        - date
        - prefix
        - clientNo
        - caseNo
        - appName
        - city
        - stage
        - status
        - isDuplicate
        - isTm11

    TrademarkUpdate:
      type: object
      properties:
        date:
          type: ["string", "null"]
        prefix:
          type: ["string", "null"]
        clientNo:
          type: ["string", "null"]
        clientName:
          type: ["string", "null"]
        caseNo:
          type: ["string", "null"]
        folderNo:
          type: ["string", "null"]
        appName:
          type: ["string", "null"]
        appClass:
          type: ["string", "null"]
        tmNo:
          type: ["string", "null"]
        city:
          type: ["string", "null"]
        stage:
          type: ["string", "null"]
        subStage:
          type: ["string", "null"]
        status:
          type: ["string", "null"]
        caseType:
          type: ["string", "null"]
        isDuplicate:
          type: ["boolean", "null"]
        isTm11:
          type: ["boolean", "null"]
        notes:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        pdfUrl:
          type: ["string", "null"]

        assignedTo:
          type: ["string", "null"]

    TrademarkStats:
      type: object
      properties:
        total:
          type: number
        recentlyModified:
          type: number
        byStage:
          type: array
          items:
            $ref: "#/components/schemas/StageCount"
        byCity:
          type: array
          items:
            $ref: "#/components/schemas/CityCount"
        duplicates:
          type: number
        tm11Count:
          type: number
        byNumericStage:
          type: array
          items:
            $ref: "#/components/schemas/StageCount"
        byAssignedSubStage:
          type: array
          items:
            $ref: "#/components/schemas/SubStageCount"
      required:
        - total
        - byStage
        - byCity
        - duplicates
        - tm11Count
        - byNumericStage
        - byAssignedSubStage

    StageCount:
      type: object
      properties:
        stage:
          type: string
        count:
          type: number
      required:
        - stage
        - count

    CityCount:
      type: object
      properties:
        city:
          type: string
        count:
          type: number
      required:
        - city
        - count

    SubStageCount:
      type: object
      properties:
        subStage:
          type: string
        count:
          type: number
      required:
        - subStage
        - count

    SyncResult:
      type: object
      properties:
        synced:
          type: number
        message:
          type: string
      required:
        - synced
        - message

    ChangeLogEntry:
      type: object
      properties:
        id:
          type: number
        trademarkId:
          type: number
        field:
          type: string
        oldValue:
          type: ["string", "null"]
        newValue:
          type: string
        changedAt:
          type: ["string", "null"]
        changedBy:
          type: string
      required:
        - id
        - trademarkId
        - field
        - newValue
        - changedBy

    DuplicateCheckResult:
      type: object
      properties:
        duplicate:
          type: boolean
        record:
          type: object
          properties:
            id:
              type: number
            tmNo:
              type: string
            appName:
              type: string
            stage:
              type: string
            clientNo:
              type: string
            caseNo:
              type: string
      required:
        - duplicate

    MonthlyStat:
      type: object
      properties:
        month:
          type: string
        stage:
          type: string
        count:
          type: number
      required:
        - month
        - stage
        - count

    Agent:
      type: object
      properties:
        id:
          type: number
        key:
          type: string
        name:
          type: string
        city:
          type: string
        createdAt:
          type: ["string", "null"]
      required:
        - id
        - key
        - name
        - city

    AgentInput:
      type: object
      properties:
        key:
          type: string
        name:
          type: string
        city:
          type: string
      required:
        - key
        - name
        - city

    CsvRow:
      type: object
      additionalProperties: true

    ImportCsvPayload:
      type: object
      properties:
        rows:
          type: array
          items:
            $ref: "#/components/schemas/CsvRow"
      required:
        - rows


